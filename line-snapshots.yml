name: Weekly Line Snapshot

on:
  schedule:
    # GitHub cron uses UTC.
    # Tuesday 15:00 UTC = 11:00 AM EDT: the week's lines are posted.
    - cron: "0 15 * * 2"
    # Sunday 15:00 UTC = 11:00 AM EDT: late numbers, before the 1:00 PM games.
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      props:
        description: "Include player props (about 7 API credits per game)? 1 = yes, 0 = game lines only"
        default: "1"

permissions:
  contents: write

concurrency:
  group: nfl-line-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Take the snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SNAPSHOT_PROPS: ${{ github.event.inputs.props || '1' }}
        run: python nfl_line_snapshot.py

      - name: Commit and push the snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add line_snapshots
          if git diff --staged --quiet; then
            echo "No snapshot to commit."
            exit 0
          fi
          git commit -m "Line snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
