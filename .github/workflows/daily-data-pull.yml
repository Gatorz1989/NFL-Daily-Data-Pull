name: Daily NFL Data Pull

# Runs automatically every day, and can also be triggered manually from the
# GitHub Actions tab (useful for testing or an on-demand mid-day refresh).
on:
  schedule:
    # Cron is in UTC. 10:00 UTC = 6:00 AM ET during Daylight Time (EDT),
    # 5:00 AM ET during Standard Time (EST). Adjust the hour below if you
    # want a different local time — GitHub does not auto-adjust for DST.
    - cron: '0 10 * * *'
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

# Allows the workflow to commit the updated JSON back into the repo
permissions:
  contents: write

jobs:
  pull-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests openpyxl

      - name: Run the data pull script
        run: python nfl_edge_data_pull.py

      - name: Commit and push the updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl_model_data.json
          git diff --staged --quiet || git commit -m "Daily data update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
