# Model Review — runs the review on GitHub's servers, so nothing has to stay open on your computer.
# It reads nfl_backtest_2024.json / nfl_backtest_2025.json / nfl_backtest_2026.json from this repo, writes model_review.json and
# model_review.md next to them, and the "Model Review" tab in the model loads model_review.json when you open it.
#
# Put this file in  .github/workflows/model-review.yml  and put model_review.py in the MAIN folder of the repo (next to the season files).
# No API key or secret is needed: the review only reads files that are already in the repo, and it never calls OddsAPI.
name: Model Review

on:
  schedule:
    - cron: '0 14 * * 2'        # every Tuesday 14:00 UTC (10:00 AM Eastern), after the weekend and Monday night games
  workflow_dispatch:             # the "Run workflow" button on the Actions page
  push:
    paths:
      - 'nfl_backtest_*.json'    # a new or updated season file triggers a fresh review
      - 'model_review.py'

permissions:
  contents: write                # lets the workflow save the report back into the repo

concurrency:
  group: model-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the review
        run: python model_review.py . .

      - name: Save the report
        run: |
          git config user.name "model-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add model_review.json model_review.md
          if git diff --cached --quiet; then
            echo "Nothing changed since the last review."
          else
            git commit -m "Model Review $(date -u +%F)"
            git push
          fi
